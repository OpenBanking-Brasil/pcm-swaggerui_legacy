      parameters:
        - name: fapiInteractionId
          description: Identificador do reporte que está sendo consultado
          in: path
          required: true
          schema:
            type: string
            pattern: ^[- /:_.',0-9a-zA-Z]{0,100}$
            maxLength: 100
