ngth":140,"pattern":"^[^\\s](.*[^\\s])?$","type":"string"},"code":{"description":"Define o código da razão pela qual o consentimento foi rejeitado. - CONSENT_EXPIRED – consentimento que ultrapassou o tempo limite para autorização. - CUSTOMER_MANUALLY_REJECTED – cliente efetuou a rejeição do consentimento manualmente através de interação nas instituições participantes. - CUSTOMER_MANUALLY_REVOKED – cliente efetuou a revogação após a autorização do consentimento. - CONSENT_MAX_DATE_REACHED – consentimento que ultrapassou o tempo limite de compartilhamento. - CONSENT_TECHNICAL_ISSUE – consentimento que foi rejeitado devido a um problema técnico que impossibilita seu uso pela instituição receptora, por exemplo: falha associada a troca do AuthCode pelo AccessToken, durante o processo de Hybrid Flow. - INTERNAL_SECURITY_REASON – consentimento que foi rejeitado devido as políticas de segurança aplicada pela instituição transmissora.","enum":["CONSENT_EXPIRED","CUSTOMER_MANUALLY_REJECTED","CUSTOMER_MANUALLY_REVOKED","CONSENT_MAX_DATE_REACHED","CONSENT_TECHNICAL_ISSUE","INTERNAL_SECURITY_REASON"],"example":"CONSENT_EXPIRED","type":"string"}},"required":["code"],"type":"object"},"rejectedBy":{"description":"Informar usuário responsável pela rejeição. 1. USER usuário 2. ASPSP instituição transmissora 3. TPP instituição receptora","enum":["USER","ASPSP","TPP"],"example":"USER","type":"string"}},"required":["rejectedBy","reason"],"type":"object"},"status":{"description":"Estado atual do consentimento cadastrado.","enum":["AUTHORISED","AWAITING_AUTHORISATION","REJECTED"],"example":"AWAITING_AUTHORISATION","type":"string"},"statusUpdateDateTime":{"description":"Data e hora em que o recurso foi atualizado. Uma string com data e hora conforme especificação RFC-3339, sempre com a utilização de timezone UTC(UTC time format).","example":"2021-05-21T08:30:00Z","format":"date-time","maxLength":20,"pattern":"^(\\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\\d|2[0123]):(?:[0123