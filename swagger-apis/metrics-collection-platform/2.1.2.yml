        "400":
          description: O formato do corpo da requisição não é um objeto válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
              examples:
                "400":
                  value:
                    message: "Report Invalid"

        "401":
          $ref: "#/components/responses/Default401Unauthorized"
        "403":
