  "/report-api/v2/mqd/settings/{proxy+}":
    get:
      tags:
        - MQD API
      summary: Obtenção de configurações das especificações de APIs
      description: |
        Endpoint dinâmico para obtenção de todos os diferentes tipos de especificações de APIs.
        
        ## Tipos de Configuração Disponíveis:
        
        ### 1. Configuração Geral
        **Endpoint:** `/report-api/v2/mqd/settings/configurationSettings.json`
        
        Retorna a lista de todas as APIs disponíveis, suas versões, caminhos base e configurações de validação associadas.
        
        ### 2. Configurações Específicas por API
        **Padrão:** `/report-api/v2/mqd/settings/{group}/{api}/{version}/response/endpoints.json`
        
        **Exemplos:**
        - `/report-api/v2/mqd/settings/DC/consents/3.2.0/response/endpoints.json` - Especificação da API de Consentimentos v3.2.0
        - `/report-api/v2/mqd/settings/DC/accounts/2.4.2/response/endpoints.json` - Especificação da API de Contas v2.4.2
        - `/report-api/v2/mqd/settings/PC/credit-portability/1.0.0/response/endpoints.json` - Especificação da API de Portabilidade de Crédito v1.0.0
        
        **Parâmetros do padrão:**
        - `{group}`: Grupo da API (DC = Dados do Cliente, PC = Portabilidade de Crédito)
        - `{api}`: Nome da API (consents, accounts, loans, etc.)
        - `{version}`: Versão da API (ex: 3.2.0, 2.4.2)
        
        ### 3. APIs Disponíveis por Grupo
        
        **Dados do Cliente (DC):**
        - consents, resources, customers
        - credit-cards-accounts, accounts, loans
        - financings, unarranged-accounts-overdraft
        - invoice-financings, credit-fixed-incomes
        - bank-fixed-incomes, variable-incomes
        - treasure-titles, funds, exchanges
        
        **Portabilidade de Crédito (PC):**
        - credit-portability
      operationId: get-configuration-settings
      parameters:
        - name: proxy+
          in: path
          required: true
          schema:
            type: string
          description: |
            Caminho dinâmico para diferentes tipos de configuração.
            
            **Exemplos válidos:**
            - `configurationSettings.json` - Configuração geral
            - `DC/consents/3.2.0/response/endpoints.json` - Especificação da API de Consentimentos
            - `PC/credit-portability/1.0.0/response/endpoints.json` - Especificação da API de Portabilidade de Crédito
          examples:
            geral:
              value: "configurationSettings.json"
              summary: "Configuração geral do sistema"
            api_especifica:
              value: "DC/consents/3.2.0/response/endpoints.json"
              summary: "Especificação da API de Consentimentos"
            validacao:
              value: "PC/credit-portability/1.0.0/response/endpoints.json"
              summary: "Especificação da API de Portabilidade de Crédito"
      responses:
        "200":
          description: |
            Configurações obtidas com sucesso. O formato da resposta varia conforme o tipo de configuração solicitada.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ConfigurationSettings"
                  - $ref: "#/components/schemas/APISpecificationConfig"
                discriminator:
                  propertyName: type
              examples:
                "Configuração Geral":
                  summary: "Resposta para /settings/configurationSettings.json"
                  value:
                    Version: "1.0.15"
                    ValidationSettings:
                      APIGroupSettings:
                        - group: "Dados Abertos"
                          base_path: "ParameterData//DA"
                          api_list:
                            - api: "Títulos de Capitalização"
                              base_path: "capitalization-bonds"
                              version: "1.0.1"
                              endpoint_base: "/opendata-capitalization/v1"
                            - api: "Investimentos"
                              base_path: "investments"
                              version: "1.0.0"
                              endpoint_base: "/opendata-investments/v1"
                        - group: "Dados do Cliente"
                          base_path: "ParameterData//DC"
                          api_list:
                            - api: "Consentimento"
                              base_path: "consents"
                              version: "3.2.0"
                              endpoint_base: "/consents/v3"
                            - api: "Contas"
                              base_path: "accounts"
                              version: "2.4.2"
                              endpoint_base: "/accounts/v2"
                      TransmitterValidationRate: 100
                      ReceiverValidationRate: 100
                      ExtremelyHighTroughputValidationRate: 100
                      HighTroughputValidationRate: 100
                      MediumTroughputValidationRate: 100
                      LowTroughputValidationRate: 100
                      VeryLowTroughputValidationRate: 100
                    ReportSettings:
                      ReportExecutionWindow: 30
                      SendOnReportNumber: 50000
                    SecuritySettings:
